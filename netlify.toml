[build]
  command = "npm run build"
  publish = "dist"
  functions = "dist/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/vesselfinder"
  to = "/.netlify/functions/vesselfinder"
  status = 200

[[redirects]]
  from = "/api/vesselfinder-details"
  to = "/.netlify/functions/vesselfinder-details"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Headers = "Content-Type"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Headers = "Content-Type"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
